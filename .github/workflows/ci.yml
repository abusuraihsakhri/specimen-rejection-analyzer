name: Specimen Rejection Analyzer CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q agents cli.py rejection_analyzer.py enrichment.py simulator.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify installed CLI entry point
        run: specimen-rejection-analyzer audit --task-id CI-001 --target SPECIMEN-001 --primary 10 --secondary 2 --status NOMINAL
      - name: Browser static application smoke test
        run: |
          node --check tests/browser-smoke.cjs
          node tests/browser-smoke.cjs
      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off
